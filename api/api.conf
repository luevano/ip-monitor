# Settings for ip-monitor-api.service (no secrets in here).

# Where the API listens. Keep it on localhost behind a reverse proxy with TLS.
IP_MONITOR_API_HOST=127.0.0.1
IP_MONITOR_API_PORT=8000

# The path the reverse proxy serves the API under ("" for none).
IP_MONITOR_API_ROOT_PATH=/ip-monitor

# Proxies whose X-Forwarded-For header is trusted, comma separated. The API
# takes the client's public address from it, so only list your own proxy.
IP_MONITOR_API_FORWARDED_ALLOW_IPS=127.0.0.1
